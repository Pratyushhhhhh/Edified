<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edified – A one step platform to access news</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Barlow+Condensed:wght@700&family=Barlow:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="edifiedhomepage.css" />
  
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">

    // temporary data 
    const featuredArticles = [
      { id: 1, image: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/41/Flag_of_India.svg/1280px-Flag_of_India.svg.png", title: "Political stability, political predictability restored investor confidence in India.", date: "February 15, 2026 06:49 pm IST" },
      { id: 2, image: "https://assets.khelnow.com/news/uploads/2025/09/Asia-Cup-2025-India-vs-Pakistan-India-Pakistan.jpg", title: "India vs Pakistan T20 World Cup LIVE: Ishan Kishan completes half-century in 27 balls", date: "February 15, 2026 07:34 pm IST" },
    ];
    const listArticles = [
      { id: 3, image:"https://www.shutterstock.com/image-illustration/3d-rendering-united-states-america-260nw-1357540115.jpg", title: "Trump Issues Stark Warning to Iran As High-Stakes Nuclear Talks Kick Off", date: "February 15, 2026 06:49 pm IST", thumb: true },
      { id: 4,image:"https://tse4.mm.bing.net/th/id/OIP.uiLbq0PwzOL6r1-g2-qbyQHaGq?pid=Api&h=220&P=0", title: "Russian Company Develops Brain-Controlled Spy Pigeons, Promises They're Only for Peaceful Purposes", date: "February 15, 2026 05:22 pm IST", thumb: true },
      { id: 5,image:"https://tse2.mm.bing.net/th/id/OIP._IU7e-7p4TACf2RFtIUeFgHaE8?pid=Api&h=220&P=0", title: "Supreme Court to hear landmark case on AI-generated evidence in criminal proceedings", date: "February 15, 2026 03:10 pm IST", thumb: true },
      { id: 6,image:"https://i.pinimg.com/736x/02/77/d2/0277d2037b4c50b0433515865e7c99e6.jpg", title: "Global food prices rise for third consecutive month, UN report warns of growing hunger crisis", date: "February 15, 2026 01:45 pm IST", thumb: true },
      { id: 4,image:"https://tse4.mm.bing.net/th/id/OIP.uiLbq0PwzOL6r1-g2-qbyQHaGq?pid=Api&h=220&P=0", title: "Russian Company Develops Brain-Controlled Spy Pigeons, Promises They're Only for Peaceful Purposes", date: "February 15, 2026 05:22 pm IST", thumb: true }
    ];
    const briefingCards = [
  { id: 1, image: "https://tse3.mm.bing.net/th/id/OIP.lSSWJ_iw1AlRFbVZxRrKeQHaFT?pid=Api&h=220&P=0", headline: "Global markets rally as inflation cools" },
  { id: 2, image:"https://tse2.mm.bing.net/th/id/OIP.770svml-wutCRvNpF4LCPAHaEo?pid=Api&h=220&P=0", headline: "Scientists discover new exoplanet in habitable zone" },
  { id: 3, image: "https://tse3.mm.bing.net/th/id/OIP.O-bfpKqwudPQK2-yVjDd1gHaEL?pid=Api&h=220&P=0", headline: "Tech giants face new EU antitrust regulations" },
  { id: 3, image: "https://tse3.mm.bing.net/th/id/OIP.O-bfpKqwudPQK2-yVjDd1gHaEL?pid=Api&h=220&P=0", headline: "Tech giants face new EU antitrust regulations" }
];
    const categories = ["World", "India", "Sports", "Political", "Economic", "Tech","Entertainment"];

  

    // main header 
    function SiteHeader() {
      return (
        <div className="site-header">
          <h1>EDIFIED</h1>
          <p>a one step platform to access news</p>
        </div>
      );
    }

    // tags/nagivagtion
    function Navbar() {
      const [active, setActive] = React.useState("World");
      return (
        <nav className="nav-bar">
          <div className="nav-pills">
            <svg className="trend-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
              <polyline points="17 6 23 6 23 12"/>
            </svg>
            {categories.map(cat => (
              <button key={cat} className={`pill ${active === cat ? "active" : ""}`} onClick={() => setActive(cat)}>{cat}</button>
            ))}
          </div>
          <div className="nav-search">
            <input type="text" placeholder="Search news…" />
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
          </div>
        </nav>
      );
    }

    // main news cards
    function FeaturedCard({ article }) {
      return (
        <article className="news-card">
          {article.image
            ? <img className="card-img" src={article.image} alt={article.title} />
            : <div className="card-img-ph">Image of News</div>
          }
          <div className="card-body">
            <h2 className="card-title">{article.title}</h2>
            <p className="card-meta"><span className="red">Updated</span> – {article.date}</p>
          </div>
        </article>
      );
    }

    // article lists 
    function ArticleRow({ article }) {
      return (
        <div className="article-row">
          <div>
            <p className="article-title">{article.title}</p>
            <p className="article-meta"><span className="red">Updated</span> – {article.date}</p>
          </div>
          {article.thumb && (
          <img 
           className="article-thumb" 
           src={article.image || "https://via.placeholder.com/100"} 
           alt="thumbnail"  />
          )}
        </div>
      );
    }

    // daily briefing
    function BriefingCard({ card }) {
      return (
        <div className="br-card">
          <div className="br-img">
            {card.image ? <img src={card.image} alt={card.headline} /> : "Image of News"}
          </div>
          <div className="br-card-foot">
            <p className={`br-card-hl ${card.headline ? "" : "ph"}`}>{card.headline || "Headline"}</p>
          </div>
        </div>
      );
    }

    // RHS news
    
    function RightPanel() {
  const [width, setWidth] = React.useState(360);
  const dragging = React.useRef(false);
  const startX = React.useRef(0);
  const startW = React.useRef(0);

  const onMouseDown = (e) => {
    dragging.current = true;
    startX.current = e.clientX;
    startW.current = width;
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup', onMouseUp);
  };

  const onMouseMove = (e) => {
    if (!dragging.current) return;
    const diff = startX.current - e.clientX;
    setWidth(Math.min(600, Math.max(200, startW.current + diff)));
  };

  const onMouseUp = () => {
    dragging.current = false;
    document.removeEventListener('mousemove', onMouseMove);
    document.removeEventListener('mouseup', onMouseUp);
  };

  return (
    <aside className="right-panel" style={{ width: width, position: 'relative', flexShrink: 0 }}>

      {/* drag handle slider*/}
      <div
        onMouseDown={onMouseDown}
        style={{ position: 'absolute', top: 0, left: 0, width: '5px', height: '100%', cursor: 'ew-resize', background: 'var(--border)', zIndex: 10 }}
      />

      <div className="br-heading">Daily Briefing</div>
      {briefingCards.map((card, i) => (
        <React.Fragment key={card.id}>
          <BriefingCard card={card} />
          {i < briefingCards.length - 1 && <div className="br-sep" />}
        </React.Fragment>
      ))}
    </aside>
  );
}

    // Root for page assembly 
    function App() {
      return (
        <div>
          <SiteHeader />
          <Navbar />
          <div className="page-body">
            <section className="left-panel">
              <div className="top-cards">
                {featuredArticles.map(a => <FeaturedCard key={a.id} article={a} />)}
              </div>
              <div className="article-list">
                {listArticles.map(a => <ArticleRow key={a.id} article={a} />)}
              </div>
            </section>
            <RightPanel />
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>
</body>
</html>
