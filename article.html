<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDIFIED - Goat Joins Rampaging Monkeys</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body class="article-page">
    <div id="root"></div>

    <script type="text/babel">
        // NavHeader Component
        const NavHeader = () => {
            const topLinks = ['For You', 'Local', 'Trending'];
            
            return (
                <header className="nav-header">
                    <h1 className="logo">EDIFIED</h1>
                    <nav className="nav-links-top">
                        <a href="index.html">Home</a>
                        {topLinks.map((link) => (
                            <a key={link} href="#">{link}</a>
                        ))}
                    </nav>
                    <div className="search-container">
                        <input type="text" placeholder="" />
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </div>
                </header>
            );
        };

        // CategoryBar Component
        const CategoryBar = () => {
            const categories = [
                { name: 'WORLD', active: true, href: 'index.html' },
                { name: 'INDIA', active: false, href: '#' },
                { name: 'TECH', active: false, href: '#' },
                { name: 'POLITICAL', active: false, href: '#' },
                { name: 'ECONOMIC', active: false, href: '#' },
                { name: 'SPORTS', active: false, href: '#' }
            ];

            return (
                <div className="category-bar">
                    <div className="category-container">
                        {categories.map((cat) => (
                            <a 
                                key={cat.name} 
                                href={cat.href} 
                                className={`cat-pill ${cat.active ? 'active' : ''}`}
                            >
                                {cat.name}
                            </a>
                        ))}
                    </div>
                </div>
            );
        };

        // Article Component
        const Article = () => (
            <main className="article-main">
                <div className="article-header-text">
                    <h1 className="article-title">Goat Joins Rampaging Monkeys On<br />Loose In St. Louis</h1>
                    <p className="article-date">February 18,2026</p>
                </div>
                
                <div className="article-content">
                    <div className="article-image">
                        <img src="images/goat.png" alt="Goat on street" />
                    </div>
                    <div className="article-text-side">
                        <div className="article-meta">
                            <span className="red-text">13 Articles-</span><span className="red-text bold">3 hours ago</span>
                        </div>
                        <div className="article-paragraphs">
                            <p><span className="red-caret">{'>'}</span>An unspecified number of monkeys that are out of a barrel and have, for reasons unknown, been joined by a rogue goat on the streets of St. Louis.</p>
                            <p><span className="red-caret">{'>'}</span>If it seems like only yesterday that we'd initially reported about the primates, then you're wrong, because it was earlier today.</p>
                            <p><span className="red-caret">{'>'}</span>Regardless, a handful of vervet monkeys in the Show Me state that haven't been able to be captured pose some questions - actually, all of the questions.</p>
                        </div>
                    </div>
                </div>

                <div className="tabs-container">
                    <span className="tab active">13 Articles</span>
                    <span className="tab">All</span>
                </div>

                <div className="related-wrapper">
                    <div className="related-card-item">
                        <h3 className="related-title">Goat joins mystery monkeys on the loose in Missouri</h3>
                        <p className="related-desc">The St. Louis Department of Health confirmed a black and white goat has been seen wandering loose in the same city where at least four vervet monkeys were spotted during the weekend.</p>
                        <span className="source-pill">The Hindu</span>
                    </div>
                </div>
            </main>
        );

        // App Component
        const App = () => (
            <React.Fragment>
                <NavHeader />
                <CategoryBar />
                <Article />
            </React.Fragment>
        );

        // Render the App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
